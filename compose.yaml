services:
  db:
    image: mariadb:10.6
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      - ./9f1r7v_myd_infomaniak_com.sql:/docker-entrypoint-initdb.d/001-site.sql:ro

  wordpress:
    image: wordpress:php7.4-apache
    depends_on:
      - db
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./local/wp-config.local.php:/var/www/html/wp-config.php:ro

volumes:
  db_data:
